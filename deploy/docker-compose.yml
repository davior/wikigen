# Synology Container Manager project for WikiGen.
# Place this file in /volume1/docker/wikigen/ alongside .env and data/.
services:
  wikigen:
    image: ghcr.io/davior/wikigen:latest
    container_name: wikigen
    # Run as your DSM user so the container can write to ./data.
    # Find the numbers with `id` over SSH (typically 1026:100).
    user: "1026:100"
    env_file: .env
    # Use the NAS's own network stack. Synology project bridge networks often
    # can't resolve DNS ("Failed to resolve"), and host mode sidesteps that.
    # The app listens directly on the NAS at $PORT (default 5055).
    network_mode: host
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    container_name: wikigen-watchtower
    # Update once a night rather than minutes after every merge: an update
    # restarts WikiGen and kills any generation in progress. The schedule is
    # 6-field cron in UTC; 17:00 UTC is 3 am at UTC+10. See the README to
    # update immediately.
    command: --label-enable --cleanup --schedule "0 0 17 * * *"
    # Same bridge-network DNS problem as the app (lookups of ghcr.io fail).
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment if the GHCR package is private (see README):
      # - ./config.json:/config.json:ro
    restart: unless-stopped
