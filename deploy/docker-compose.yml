# Synology Container Manager project for WikiGen.
# Place this file in /volume1/docker/wikigen/ alongside .env and data/.
services:
  wikigen:
    image: ghcr.io/davior/wikigen:latest
    container_name: wikigen
    # Run as your DSM user so the container can write to ./data.
    # Find the numbers with `id` over SSH (typically 1026:100).
    user: "1026:100"
    env_file: .env
    # Explicit resolvers: Synology project networks often inherit a DNS setup
    # the container can't use ("Failed to resolve"). Swap in your router's IP
    # (e.g. 192.168.0.1) if you rely on local DNS names.
    dns:
      - 1.1.1.1
      - 9.9.9.9
    # If the wiki is hosted on your LAN and the router lacks NAT loopback,
    # point its hostname straight at the LAN address:
    # extra_hosts:
    #   - "yourwiki.example.com:192.168.0.x"
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "5055:5055"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    container_name: wikigen-watchtower
    command: --label-enable --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment if the GHCR package is private (see README):
      # - ./config.json:/config.json:ro
    restart: unless-stopped
