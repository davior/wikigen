# Synology Container Manager project for WikiGen.
# Place this file in /volume1/docker/wikigen/ alongside .env and data/.
services:
  wikigen:
    image: ghcr.io/davior/wikigen:latest
    container_name: wikigen
    # Run as your DSM user so the container can write to ./data.
    # Find the numbers with `id` over SSH (typically 1026:100).
    user: "1026:100"
    env_file: .env
    # Use the NAS's own network stack. Synology project bridge networks often
    # can't resolve DNS ("Failed to resolve"), and host mode sidesteps that.
    # The app listens directly on the NAS at $PORT (default 5055).
    network_mode: host
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower
    container_name: wikigen-watchtower
    command: --label-enable --cleanup --interval 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Uncomment if the GHCR package is private (see README):
      # - ./config.json:/config.json:ro
    restart: unless-stopped
